<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1080px; font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
  .card { padding: 40px; }
  .meta { font-size: 26px; color: #94a3b8; margin-bottom: 8px; }
  .title { font-size: 44px; font-weight: 700; line-height: 1.15; margin-bottom: 20px; }
  .chips { margin-bottom: 24px; }
  .chip { display: inline-block; font-size: 24px; padding: 6px 16px; border-radius: 999px;
          background: #1e293b; color: #cbd5e1; margin-right: 10px; }
  .does { font-size: 32px; line-height: 1.4; background: #1e293b; border-left: 6px solid #38bdf8;
          padding: 24px; border-radius: 12px; margin-bottom: 24px; }
  .visual img { width: 100%; border-radius: 12px; border: 1px solid #334155; }
  .example { font-size: 28px; line-height: 1.5; background: #11203a; padding: 24px; border-radius: 12px; }
</style></head>
<body><div class="card">
  <div class="meta">{{REPO}} · #{{NUMBER}} · {{BRANCH}} · {{STATE}}</div>
  <div class="title">{{TITLE}}</div>
  <div class="chips">{{CHIPS}}</div>
  <div class="does">{{WHAT_IT_DOES}}</div>
  <div class="visual">{{VISUAL}}</div>
</div></body></html>
